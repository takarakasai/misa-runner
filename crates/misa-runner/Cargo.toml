[package]
name = "misa-runner"
description = "四脚ロボットの実機制御アプリ: プロポ (S.BUS) 操縦、歩容切替、ポーズ再生。対応機は robots/ のプロファイルで決まる。"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "misa-run"
path = "src/main.rs"

[dependencies]
misa-core.workspace = true
postcard.workspace = true
misa-plant-mujoco = { path = "../misa-plant-mujoco", optional = true }
r2r = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
misa-hal.workspace = true
libc.workspace = true
misarta.workspace = true
quadruped-gait.workspace = true
nalgebra.workspace = true
serde.workspace = true
toml.workspace = true
log.workspace = true
env_logger.workspace = true
zenoh = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = ["viz"]
# MuJoCo で動力学込みに回す（`misa-run sim`）。MuJoCo 3.8 の共有ライブラリが
# 要るので既定では外してある:  export MUJOCO_DYNAMIC_LINK_DIR=$HOME/.mujoco/mujoco-3.8.0/lib
sim = ["dep:misa-plant-mujoco"]
# MuJoCo の絵をオフスクリーンで PNG に落とす（`sim --video DIR`）。EGL が要る。
render = ["sim", "misa-plant-mujoco/render"]
# **ROS 2 から操縦する**（cmd_vel + サービス 5 本）。要るのは標準の
# `geometry_msgs` と、このリポジトリが持つ `misa_msgs` だけ。**機体に依らない。**
# ビルド手順は ros/README.md。
ros2 = ["dep:r2r", "dep:futures"]
# **ブリッジ越しの機体（keel など）はここには入れない。**
# 相手の独自メッセージに束縛されるので、機体側のリポジトリが `Backend` を
# 実装して差す。ここに入れると、操縦だけしたい機体でも向こうの ws が要る。
# ライブ可視化。`quadruped-gait/viz` が GaitVizFrame に serde を付ける。
viz = ["dep:zenoh", "dep:serde_json", "quadruped-gait/viz"]
