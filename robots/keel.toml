# keel — STM のブリッジへ ROS 2 で繋ぐ構成。
#
# **配線もモータ id も校正値も、ここには書かない。** ゼロ点・可動域・符号は
# STM が持ち、CAN は STM が握る。PC が持つのはモデルと歩容の設定だけ。
#
# **まだ Ros2Plant が無いので run はできない。** いま通るのは check / dump /
# sim（どちらもモデルの [joint.limit] で可動域を検証する）。
name = "keel"

[control]
model = "../keel/model/proto2_asset/urdf/mvp_v2.misa"
rate_hz = 200.0
kinematics_pose = "home"
# **proto2 のモデルは [[pose]] を 1 つも持たない。** 旧 mvp_v12 にあった
# home / constrain2 / test は無くなった。名前を指しても警告が出て home
# （全関節 0 = 脚を伸ばし切った姿勢）に落ちるだけなので、指さない。
#
# **実機の電源投入姿勢はこれで決まらない。** 畳んだ姿勢が要るなら、
# モデルに [[pose]] を足すか、STM ブリッジ側で持つ必要がある。
start_pose = ""
[poses]
greeting = ""
greeting_alt = ""

# **keel は MuJoCo でまだ立てない。歩容以前の話。** 原因は制御ではなく衝突設定:
#
#   腿の凸包が胴体の凸包に食い込み、85,000〜101,000 N で押し返されている。
#   腿は指令 +0.791 rad に対し実測 +0.023 rad で、胴体に押さえつけられて
#   ほとんど動かない（膝は -1.588 と正しく追従している）。胴体は指令 0.300 に
#   対し 0.215 までしか上がらず、腿で接地する。
#
# **ゲインでも刻みでも直らない**（kp 200〜8000、dt 2 ms〜0.25 ms、膝の向き
# 4 通り、いずれも同じ）。中立姿勢の時点で重なっているため。
#
# `base_link` と `FL_thigh` は親子ではない（間に `FL_hip` がある）ので、
# MuJoCo の隣接リンク自動除外が効かない。これを消すのが `.misa` の
# `[[collision_pair]]`（`enabled = false`）だが、**2 つ穴がある**:
#
#   1. proto2 のモデルは collision_pair を 1 件も持たない。
#      旧 mvp_v12 は 253 件持っていた。
#   2. articara の MJCF 出力が collision_pair を見ていない。
#      `<contact><exclude>` も contype/conaffinity も出していないので、
#      **旧モデルの 253 件も実際には効いていなかった。** 旧モデルが動いて
#      いたのは、腿の当たり判定が箱＋円柱で胴体と重ならなかったから。
#      proto2 は mesh（＝MuJoCo では凸包）になったので重なる。
#
# どちらもこのリポジトリの外。歩容の評価はここが片付いてから。
#
[gait]
# **keel の膝は後ろにしか曲がらない**（calf の可動域が -2.705..-0.838 で
# 常に負）。`<>` は後脚に正の膝角を要求するので可動域を破る。**それでも
# MuJoCo は「それらしく」動き、しかも速く前へ進んで見える** — 脚が可動域に
# 当たって長さが変わっているだけで、歩行ではない。一度これを「調整結果」
# として採ってしまった (2026-09-01)。`sim` にも `dump` と同じ可動域検査を
# 入れてあるので、いまは同じ間違いをすると止まる。
knee_pattern = "both_back"
trot_cycle_s = 0.35
stance_height_m = 0.27
swing_height_m = 0.07
max_vx_m_s = 0.4
max_vy_m_s = 0.2
max_wz_rad_s = 0.8

# 車輪 4 軸。歩容もチキンヘッドも触らないので、指令は出ない（観測のみ）。
[[aux]]
joint = "FL_wheel_joint"
role = "wheel"
[[aux]]
joint = "FR_wheel_joint"
role = "wheel"
[[aux]]
joint = "RL_wheel_joint"
role = "wheel"
[[aux]]
joint = "RR_wheel_joint"
role = "wheel"

[hardware]
kind = "ros2"
node_name = "misa_run"
namespace = "/keel"
# STM のブリッジが購読／配信しているトピック（ksm_mvp_real_ws）。
command_topic = "/low_command_msg"
state_topic = "/low_state"
state_timeout_ms = 50
# cmd_vel は 10〜20 Hz の publisher もあるので、状態より緩く取る。
cmd_vel_timeout_ms = 300
default_max_speed_rad_s = 8.0
max_target_rate_rad_s = 3.0
