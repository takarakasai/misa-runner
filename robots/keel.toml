# keel — STM のブリッジへ ROS 2 で繋ぐ構成。
#
# **配線もモータ id も校正値も、ここには書かない。** ゼロ点・可動域・符号は
# STM が持ち、CAN は STM が握る。PC が持つのはモデルと歩容の設定だけ。
#
# **まだ Ros2Plant が無いので run はできない。** いま通るのは check / dump /
# sim（dump と sim は可動域の検証を飛ばす — 可動域を PC が持たないため）。
name = "keel"

[control]
model = "../mdls/keel/mvp_v12.misa"
rate_hz = 200.0
start_pose = "constrain2"
kinematics_pose = "home"
# 電源投入時の姿勢。校正値を PC が持たないので、モデルの姿勢名で指す。
rest_pose = "constrain2"

# keel のモデルが持つポーズは home / constrain2 / test。namiashi の
# greeting は無いので、演出は名前を空にして無効にしてある。
[poses]
greeting = ""
greeting_alt = ""

# MuJoCo で振って決めた値（実機では未検証）。判定は「4 脚とも遊脚になるか」
# 「静止指令でドリフトしないか」「指令どおりの速度が出るか」。
#
#   静止        終端 (+0.004, +0.005)   ← ドリフトほぼ無し
#   前進 0.12   終端 (+1.441, +0.014)
#   横   0.10   終端 (+0.706, +0.680)
#   旋回 0.5    終端 (-0.025, +0.557)
#
# **残っている問題: 後退指令 0.12 でも +0.466 と前へ出る。** 速度を入れると
# 前向きの偏りが乗る（静止では出ない）。ここはまだ詰まっていない。
#
# kp = 60（namiashi の値）だと自重を支えられず崩れる。200 で立つ。
[gait]
# **keel は `<>`（前が後ろ向き・後ろが前向き）。** ここを間違えると IK が
# 鏡像の足先軌道を作り、歩容は正しく動いているのに逆へ進む。実際 namiashi と
# 同じ `<<` にしていたあいだ、4 脚とも正しく遊脚しているのに後退していた。
knee_pattern = "mammalian_forward"
# stance を 0.29 まで上げると後脚が可動域に当たって遊脚にならない（実測）。
trot_cycle_s = 0.35
stance_height_m = 0.27
swing_height_m = 0.07
max_vx_m_s = 0.4
max_vy_m_s = 0.2
max_wz_rad_s = 0.8

# 車輪 4 軸。歩容もチキンヘッドも触らないので、指令は出ない（観測のみ）。
[[aux]]
joint = "FL_wheel_joint"
role = "wheel"
[[aux]]
joint = "FR_wheel_joint"
role = "wheel"
[[aux]]
joint = "RL_wheel_joint"
role = "wheel"
[[aux]]
joint = "RR_wheel_joint"
role = "wheel"

[hardware]
kind = "ros2"
node_name = "misa_run"
namespace = "/keel"
# STM のブリッジが購読／配信しているトピック（ksm_mvp_real_ws）。
command_topic = "/low_command_msg"
state_topic = "/low_state"
state_timeout_ms = 50
# cmd_vel は 10〜20 Hz の publisher もあるので、状態より緩く取る。
cmd_vel_timeout_ms = 300
default_max_speed_rad_s = 8.0
max_target_rate_rad_s = 3.0
