# keel — STM のブリッジへ ROS 2 で繋ぐ構成。
#
# **配線もモータ id も校正値も、ここには書かない。** ゼロ点・可動域・符号は
# STM が持ち、CAN は STM が握る。PC が持つのはモデルと歩容の設定だけ。
#
# **まだ Ros2Plant が無いので run はできない。** いま通るのは check / dump /
# sim（どちらもモデルの [joint.limit] で可動域を検証する）。
name = "keel"

[control]
model = "../keel/model/proto2_asset/urdf/mvp_v2.misa"
rate_hz = 200.0
kinematics_pose = "home"
# 屈伸の 2 姿勢をモデルに足した（2026-09-02）。IK で足先を胴体高さ
# 0.14 / 0.38 に置いた解で、hip は 0。
#
#   crouch  屈。足を引き上げて**車輪（胴体 -0.155 m）で座る**
#   extend  伸。脚を伸ばして立つ。車輪は 0.225 m 浮く
#
# 電源投入時は車輪で座っているのが自然なので、待機も初期姿勢も crouch。
# **実機の電源投入姿勢がこれと違うなら、ここを直すこと。** 脱力からの
# 遷移はこの姿勢を始点に張るので、食い違うと実機では起こらない軌道が出る。
start_pose = "crouch"
rest_pose = "crouch"
[poses]
greeting = ""
greeting_alt = ""

# **胴体と腿の当たり判定が凸分解され、keel は歩く**（2026-09-02、モデル側の
# 対応）。base_link が 8 片、各 thigh が 5 片。**全姿勢・膝の向き 4 通りとも
# 重なり 0 組**（home / 立ち / crouch / extend）。
#
# **シムのゲインは kp 1200 / kv 30、物理刻み 0.5 ms。** ここは実機とは別物で、
# 実機の kp/kd は STM ブリッジが MIT モードで持つ。
#
#   misa-run sim --robot robots/keel.toml --kp 1200 --kv 30 --timestep 0.0005
#
# **既定の 2 ms では減衰を上げられない。** articara の PD は Rust 側で計算して
# motor に流す明示的な帰還なので `kv < 2·I/dt` でしか安定しない。2 ms のまま
# kp だけ上げると進む量が 64% → 135% → 166% → 45% と暴れる（kv が足りず
# 跳ねる）。刻みを 0.5 ms にすると使える kv が 4 倍になり、そこで初めて収束する。
#
# 実測（trot、歩容 17 秒）:
#
#              実測          期待       達成
#   静止       +0.010 m       0         ドリフトほぼゼロ、回転 +0.7°
#   前進 0.12  +2.037 m      +2.04 m    100%
#   後退 0.12  -2.003 m      -2.04 m     98%
#   旋回 +0.5  +395.4°       +487°       81%
#   横   +0.10 +1.625 m      +1.70 m     96%
#
# pitch は -0.11..-0.41° で水平。遊脚率は 49〜56%（trot の接地比 0.5 に一致）。
# 接地中の足の滑りは 0.19 → 0.03 m/s。残るのは旋回の 81%。
#
[gait]
# **`<<`（4 脚とも膝が後ろ向き）。**
#
# **一度これを「後退するから駄目」と切り捨てたが、間違いだった** (2026-09-02)。
# 判断したのが kp 200 のときで、あの領域では減衰が足りず何を選んでも暴れて
# いた。ゲインを直したら `<<` は前へ歩き、しかも `><` より良い:
#
#              前進        後退        横         旋回
#   both_back  100%       98%        96%        81%
#   mammalian_reverse  94%   94%     97%        78%
#
# `<<` は遊脚高さの制約も緩い。`><` は前脚の calf が正側を使うので上限
# +2.182 に当たって swing 0.10 が限界だが、`<<` は負側なので 0.20 まで入る。
# そのぶん swing を 0.16 まで上げられて、指令どおりの量が出るようになった。
knee_pattern = "both_back"
trot_cycle_s = 0.35
stance_height_m = 0.30
# `<<` なら 0.20 まで可動域内。0.10 → 0.13 → 0.16 で 80% → 87% → 100% と
# 素直に伸びる。0.16 で指令どおりになったのでここで止める。
swing_height_m = 0.16
max_vx_m_s = 0.4
max_vy_m_s = 0.2
max_wz_rad_s = 0.8
# **その場で胴体を傾ける。** 足は接地したまま胴体だけ回る。0 だと無効（既定）。
#
# **上限は「合成量」で、軸ごとではない。** 3 軸に分けると合わさったぶんが
# 脚の可動域を食う。`dump --tilt-roll R --tilt-pitch P --tilt-yaw Y` を
# 16 方向へ振った違反数（歩容 trot、`<<`）:
#
#   swing_height    N=0.20   N=0.30   N=0.40   N=0.50
#   0.16（採用）      0/16     4/16     7/16    13/16
#   0.10             0/16     0/16     0/16     3/16
#
# **遊脚高さと取り合いになる。** 歩くほうを採って swing 0.16（指令の 100%）に
# したので、姿勢は 0.20 まで。姿勢を大きく振りたいなら swing を 0.10 へ下げる
# と 0.40 まで入る（そのとき歩行は 80%）。
#
# 判定は歩容を回したまま傾けている。実際には立ち止まって傾けることが多く、
# そのぶん余裕はあるが、**設定は 1 つの数なので厳しい側に合わせる。**
body_attitude_max_rad = 0.20
body_attitude_tau_s = 0.15

# 車輪 4 軸。歩容もチキンヘッドも触らないので、指令は出ない（観測のみ）。
[[aux]]
joint = "FL_wheel_joint"
role = "wheel"
[[aux]]
joint = "FR_wheel_joint"
role = "wheel"
[[aux]]
joint = "RL_wheel_joint"
role = "wheel"
[[aux]]
joint = "RR_wheel_joint"
role = "wheel"

[hardware]
kind = "ros2"
node_name = "misa_run"
namespace = "/keel"
# STM のブリッジが購読／配信しているトピック（ksm_mvp_real_ws）。
command_topic = "/low_command_msg"
state_topic = "/low_state"
state_timeout_ms = 50
# cmd_vel は 10〜20 Hz の publisher もあるので、状態より緩く取る。
cmd_vel_timeout_ms = 300
default_max_speed_rad_s = 8.0
max_target_rate_rad_s = 3.0

# **MIT のゲイン。実機を動かす前にここを埋めること。** 未設定だと `run` は
# 起動しない（ブリッジは MIT しか受けないので、kp/kd が無いと
# τ = kp(q_d − q) + kd(q̇_d − q̇) + τ_ff が恒等的に 0 になり、位置を指令して
# いるのに機体は脱力したまま崩れる）。
#
# **値はベンチで決めること。ここに数字を置いていないのは意図的。**
# 手がかり:
#
#   - MuJoCo で歩けたのは kp 1200 / kv 30 相当。ただしあれはシムの
#     位置アクチュエータの値で、**実機の安全な出発点ではない**
#   - モータの effort は hip/thigh 96 N·m、calf 180 N·m。kp 1200 だと
#     0.08 rad の誤差で腿が飽和する
#   - 立ち上げは低いところから。脚を浮かせた状態で kp を上げていき、
#     指令角へ静かに寄るところを見てから接地させる
#
# 書き方（hip, thigh, calf の順）:
#
#   [hardware.mit_gains]
#   kp = [40.0, 60.0, 60.0]
#   kd = [ 1.0,  1.5,  1.5]
