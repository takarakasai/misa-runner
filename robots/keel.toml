# keel — STM のブリッジへ ROS 2 で繋ぐ構成。
#
# **配線もモータ id も校正値も、ここには書かない。** ゼロ点・可動域・符号は
# STM が持ち、CAN は STM が握る。PC が持つのはモデルと歩容の設定だけ。
#
# **まだ Ros2Plant が無いので run はできない。** いま通るのは check / dump /
# sim（どちらもモデルの [joint.limit] で可動域を検証する）。
name = "keel"

[control]
model = "../keel/model/proto2_asset/urdf/mvp_v2.misa"
rate_hz = 200.0
kinematics_pose = "home"
# 屈伸の 2 姿勢をモデルに足した（2026-09-02）。IK で足先を胴体高さ
# 0.14 / 0.38 に置いた解で、hip は 0。
#
#   crouch  屈。足を引き上げて**車輪（胴体 -0.155 m）で座る**
#   extend  伸。脚を伸ばして立つ。車輪は 0.225 m 浮く
#
# 電源投入時は車輪で座っているのが自然なので、待機も初期姿勢も crouch。
# **実機の電源投入姿勢がこれと違うなら、ここを直すこと。** 脱力からの
# 遷移はこの姿勢を始点に張るので、食い違うと実機では起こらない軌道が出る。
start_pose = "crouch"
rest_pose = "crouch"
[poses]
greeting = ""
greeting_alt = ""

# **胴体と腿の当たり判定が凸分解され、keel は歩く**（2026-09-02、モデル側の
# 対応）。base_link が 8 片、各 thigh が 5 片。**全姿勢・膝の向き 4 通りとも
# 重なり 0 組**（home / 立ち / crouch / extend）。
#
# **シムのゲインは kp 1200 / kv 30、物理刻み 0.5 ms。** ここは実機とは別物で、
# 実機の kp/kd は STM ブリッジが MIT モードで持つ。
#
#   misa-run sim --robot robots/keel.toml --kp 1200 --kv 30 --timestep 0.0005
#
# **既定の 2 ms では減衰を上げられない。** articara の PD は Rust 側で計算して
# motor に流す明示的な帰還なので `kv < 2·I/dt` でしか安定しない。2 ms のまま
# kp だけ上げると進む量が 64% → 135% → 166% → 45% と暴れる（kv が足りず
# 跳ねる）。刻みを 0.5 ms にすると使える kv が 4 倍になり、そこで初めて収束する。
#
# 実測（trot、歩容 17 秒）:
#
#              実測          期待       達成
#   静止       +0.003 m       0         ドリフトほぼゼロ、回転 -0.1°
#   前進 0.12  +1.927 m      +2.04 m     94%
#   後退 0.12  -1.919 m      -2.04 m     94%
#   旋回 +0.5  +381.1°       +487°       78%
#   横   +0.10 +1.649 m      +1.70 m     97%
#
# **前後が対称になった**（kp 200 のときは 78% / 48%）。pitch は ±0.38° に
# 収まり、遊脚率も 43〜47%（trot の接地比 0.5 に一致）。接地中の足の滑りは
# 0.19 → 0.031 m/s。
#
# 周期は 0.30 / 0.35 / 0.45 が横並び（94〜95%）。0.30 のほうが pitch +0.09°・
# 遊脚率 48% と僅かに良いが、実機の関節速度に厳しくなるので 0.35 を採る。
#
[gait]
# **`><`（前が前向き・後ろが後ろ向き）。**
#
# 腿の分解で当たりは 4 パターンとも 0 組になったが、**`<<` はそれでも
# 後退する**（-2.220、pitch -3.75°、後脚の遊脚率 15%）。当たりが取れても
# 直らなかったので、これは干渉ではなく歩容と機体形状の相性。
#
#   both_back          <<  重なり 0 組  前後 -2.220  pitch -3.75°  後脚 遊脚率 15%
#   mammalian_reverse  ><  重なり 0 組  前後 +1.310  pitch -0.34°  遊脚率 32-33%
#
# 分解前は `<<` で前脚の腿が胴体に 35 mm 食い込んでいて（腿が 1 枚メッシュ
# ＝凸包で実体の 1.34 倍だった）、腿の追従誤差が 0.565 rad あった。分解後は
# 0.118 まで下がったが、進む向きは変わらなかった。
knee_pattern = "mammalian_reverse"
trot_cycle_s = 0.35
stance_height_m = 0.30
# **swing 0.11 以上は前脚の膝が可動域に当たる**（`><` なので前脚の calf は
# 正側を使い、上限 +2.182 に届く）。立ち高さを上げると余裕は増えるが
# （0.34 なら 0.14 まで入る）、進む量はかえって落ちた（0.34/0.14 で 32%）。
swing_height_m = 0.10
max_vx_m_s = 0.4
max_vy_m_s = 0.2
max_wz_rad_s = 0.8
# **その場で胴体を傾ける。** 足は接地したまま胴体だけ回る。0 だと無効（既定）。
#
# **上限は「合成量」で、軸ごとではない。** 単軸なら 0.60 まで入るが、
# 3 軸に分けると合わさったぶんが脚の可動域を食う。立ち高さ 0.30 での実測
# （`dump --tilt-roll R --tilt-pitch P --tilt-yaw Y`、違反件数）:
#
#   単軸 0.60           roll OK   pitch OK   yaw OK
#   合成 0.60  pitch=yaw       508 件（FL_calf が -2.705 に当たる）
#   合成 0.60  roll=pitch=yaw  540 件
#   合成 0.55  pitch=yaw       OK
#   合成 0.50  21 方向を掃引   すべて OK  ← ここを採る
#
# 立ち高さを下げると pitch が先に当たる（0.27 では合成 0.60 で 1 件、
# 0.26 では 0.55 で 1 件）。stance を下げるならここも下げること。
body_attitude_max_rad = 0.50
body_attitude_tau_s = 0.15

# 車輪 4 軸。歩容もチキンヘッドも触らないので、指令は出ない（観測のみ）。
[[aux]]
joint = "FL_wheel_joint"
role = "wheel"
[[aux]]
joint = "FR_wheel_joint"
role = "wheel"
[[aux]]
joint = "RL_wheel_joint"
role = "wheel"
[[aux]]
joint = "RR_wheel_joint"
role = "wheel"

[hardware]
kind = "ros2"
node_name = "misa_run"
namespace = "/keel"
# STM のブリッジが購読／配信しているトピック（ksm_mvp_real_ws）。
command_topic = "/low_command_msg"
state_topic = "/low_state"
state_timeout_ms = 50
# cmd_vel は 10〜20 Hz の publisher もあるので、状態より緩く取る。
cmd_vel_timeout_ms = 300
default_max_speed_rad_s = 8.0
max_target_rate_rad_s = 3.0
