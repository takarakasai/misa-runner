# keel — STM のブリッジへ ROS 2 で繋ぐ構成。
#
# **配線もモータ id も校正値も、ここには書かない。** ゼロ点・可動域・符号は
# STM が持ち、CAN は STM が握る。PC が持つのはモデルと歩容の設定だけ。
#
# **まだ Ros2Plant が無いので run はできない。** いま通るのは check / dump /
# sim（dump と sim は可動域の検証を飛ばす — 可動域を PC が持たないため）。
name = "keel"

[control]
model = "../mdls/keel/mvp_v12.misa"
rate_hz = 200.0
start_pose = "constrain2"
kinematics_pose = "home"
# 電源投入時の姿勢。校正値を PC が持たないので、モデルの姿勢名で指す。
rest_pose = "constrain2"

# keel のモデルが持つポーズは home / constrain2 / test。namiashi の
# greeting は無いので、演出は名前を空にして無効にしてある。
[poses]
greeting = ""
greeting_alt = ""

# **歩容の値はまだ当たっていない。** namiashi の値を出発点に置いてあるだけで、
# keel は脚間隔が 1.7 倍（hip 間 0.49 m 対 0.29 m）ある。MuJoCo で回すと
# 立てはするが、前進指令で後退する（足が滑っている）。実機を触る前に
# `misa-run sim` で詰めること。
#
#   cargo run --features sim -- sim --robot robots/keel.toml \
#       --gait trot --vx 0.15 --secs 10 --kp 200 --kv 2.0 --base-height 0.35
#
# kp = 60（namiashi の値）だと自重を支えられず崩れる。200 で立つ。
[gait]
stance_height_m = 0.30
swing_height_m = 0.06
max_vx_m_s = 0.4
max_vy_m_s = 0.2
max_wz_rad_s = 0.8

# 車輪 4 軸。歩容もチキンヘッドも触らないので、指令は出ない（観測のみ）。
[[aux]]
joint = "FL_wheel_joint"
role = "wheel"
[[aux]]
joint = "FR_wheel_joint"
role = "wheel"
[[aux]]
joint = "RL_wheel_joint"
role = "wheel"
[[aux]]
joint = "RR_wheel_joint"
role = "wheel"

[hardware]
kind = "ros2"
node_name = "misa_run"
namespace = "/keel"
# STM のブリッジが購読／配信しているトピック（ksm_mvp_real_ws）。
command_topic = "/low_command_msg"
state_topic = "/low_state"
state_timeout_ms = 50
default_max_speed_rad_s = 8.0
max_target_rate_rad_s = 3.0
