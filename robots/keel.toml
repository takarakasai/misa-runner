# keel — STM のブリッジへ ROS 2 で繋ぐ構成。
#
# **配線もモータ id も校正値も、ここには書かない。** ゼロ点・可動域・符号は
# STM が持ち、CAN は STM が握る。PC が持つのはモデルと歩容の設定だけ。
#
# `run` はブリッジ越しに通る（`kind = "ros2"` → Ros2Plant + Ros2Pilot）。
# **`--features bridge-ksm` が要る**（ブリッジ側の low_command_msgs /
# low_state_msgs に束縛されるため）。`--features ros2` だけだと操縦
# （cmd_vel + サービス）しか入らない。`check` / `dump` / `sim` は feature 無しで通る。
#
# **2026-09-04 に実機で 4 脚起立まで到達。** 手順は doc/realbot_build.md →
# doc/bringup_checklist_keel.md（記録欄あり）。実機に触れない順に
# check → dump → bridge → run（bridge は指令が脱力のままなので動かない）。
name = "keel"

[control]
model = "../keel/model/proto2_asset/urdf/mvp_v2.misa"
rate_hz = 200.0
kinematics_pose = "home"
# 屈伸の 2 姿勢をモデルに足した（2026-09-02）。IK で足先を胴体高さ
# 0.14 / 0.38 に置いた解で、hip は 0。
#
#   crouch  屈。足先が胴体 -0.14 m。足の球（半径 0.025）の底が -0.165 で、
#           車輪の底 -0.155 より 10 mm 低いので**足で接地する**（実測の
#           落ち着き先は胴体 0.157 m）。車輪は 2 mm 浮くだけでほぼ接する
#   extend  伸。足先が胴体 -0.38 m。実測 0.401 m で立つ。車輪は 0.246 m 浮く
#
# **これはシムと `dump` の初期姿勢で、実機では使わない。**
# 脱力した姿勢は一意に決まらないので、実機は毎周期の実測を始点にする。
# 状態を 1 通も受け取れていないうちは脱力のまま待つ（読めていない軸の
# 観測は 0 で、keel の 0 は脚を伸ばし切った姿勢だから）。
start_pose = "crouch"
rest_pose = "crouch"
[poses]
greeting = ""
greeting_alt = ""

# **胴体と腿の当たり判定が凸分解され、keel は歩く**（2026-09-02、モデル側の
# 対応）。base_link が 8 片、各 thigh が 5 片。**全姿勢・膝の向き 4 通りとも
# 重なり 0 組**（home / 立ち / crouch / extend）。
#
# **シムのゲインは kp 1200 / kv 30、物理刻み 0.5 ms。** ここは実機とは別物で、
# 実機の kp/kd は STM ブリッジが MIT モードで持つ。
#
#   misa-run sim --robot robots/keel.toml --kp 1200 --kv 30 --timestep 0.0005
#
# **既定の 2 ms では減衰を上げられない。** articara の PD は Rust 側で計算して
# motor に流す明示的な帰還なので `kv < 2·I/dt` でしか安定しない。2 ms のまま
# kp だけ上げると進む量が 64% → 135% → 166% → 45% と暴れる（kv が足りず
# 跳ねる）。刻みを 0.5 ms にすると使える kv が 4 倍になり、そこで初めて収束する。
#
# 実測（trot、歩容 17 秒）:
#
#              実測          期待       達成
#   静止       +0.010 m       0         ドリフトほぼゼロ、回転 +0.7°
#   前進 0.12  +2.037 m      +2.04 m    100%
#   後退 0.12  -2.003 m      -2.04 m     98%
#   旋回 +0.5  +395.4°       +487°       81%
#   横   +0.10 +1.625 m      +1.70 m     96%
#
# pitch は -0.11..-0.41° で水平。遊脚率は 49〜56%（trot の接地比 0.5 に一致）。
# 接地中の足の滑りは 0.19 → 0.03 m/s。残るのは旋回の 81%。
#
[gait]
# **`<<`（4 脚とも膝が後ろ向き）。**
#
# **一度これを「後退するから駄目」と切り捨てたが、間違いだった** (2026-09-02)。
# 判断したのが kp 200 のときで、あの領域では減衰が足りず何を選んでも暴れて
# いた。ゲインを直したら `<<` は前へ歩き、しかも `><` より良い:
#
#              前進        後退        横         旋回
#   both_back  100%       98%        96%        81%
#   mammalian_reverse  94%   94%     97%        78%
#
# `<<` は遊脚高さの制約も緩い。`><` は前脚の calf が正側を使うので上限
# +2.182 に当たって swing 0.10 が限界だが、`<<` は負側なので 0.20 まで入る。
# そのぶん swing を 0.16 まで上げられて、指令どおりの量が出るようになった。
knee_pattern = "both_back"
trot_cycle_s = 0.60
# **walk は trot より目標が速い**（接地比 0.75 で遊脚時間が短い）。1.0 s で
# 膝 4.20 rad/s（定格の 40%）。trot の 3.40 に合わせるなら 1.2 s。
# `dump` が毎回突き合わせる。
walk_cycle_s = 1.0
stance_height_m = 0.30
# **低く・ゆっくりへ振ってある**（2026-09-04、実機の要望）。
# 0.16/0.35 のほうがシムでは速く歩けたが（指令の 100%）、遊脚が速すぎる。
#
#   swing/cycle   膝の最大 rad/s（定格 10.47 の比）  シムの前進（kp 1200）
#   0.16 / 0.35   16.00  153%  ← 定格超。使えない
#   0.08 / 0.45    6.80   65%   80%
#   0.05 / 0.60    3.40   32%   75%   ← いまここ
#   0.04 / 0.80    2.00   19%   71%
#
# 進む量の代償は小さい（80% → 75%）。実際に上がる高さは 0.048 m。
swing_height_m = 0.05
max_vx_m_s = 0.4
max_vy_m_s = 0.2
max_wz_rad_s = 0.8
# **その場で胴体を傾ける。** 足は接地したまま胴体だけ回る。0 だと無効（既定）。
#
# **上限は「合成量」で、軸ごとではない。** 3 軸に分けると合わさったぶんが
# 脚の可動域を食う。`dump --tilt-roll R --tilt-pitch P --tilt-yaw Y` を
# 16 方向へ振った違反数（歩容 trot、`<<`）:
#
#   swing_height    N=0.20   N=0.30   N=0.40   N=0.50
#   0.16（採用）      0/16     4/16     7/16    13/16
#   0.10             0/16     0/16     0/16     3/16
#
# **遊脚高さと取り合いになる。** 歩くほうを採って swing 0.16（指令の 100%）に
# したので、姿勢は 0.20 まで。姿勢を大きく振りたいなら swing を 0.10 へ下げる
# と 0.40 まで入る（そのとき歩行は 80%）。
#
# 判定は歩容を回したまま傾けている。実際には立ち止まって傾けることが多く、
# そのぶん余裕はあるが、**設定は 1 つの数なので厳しい側に合わせる。**
body_attitude_max_rad = 0.20
body_attitude_tau_s = 0.15
# **傾きの報告は `control.max_tilt_rad` で、ここから導かれる。** 省略している
# ので 0.20 + 0.3 = 0.50 rad（29°）を超えたら ERROR を出す。**接地センサが
# 無いので、転倒に近づいたことを知る手がかりはこれだけ。** 自動では脱力
# しない（荷重がかかった四足を脱力させると崩れる）。`check` が実効値を出す。

# 車輪 4 軸。歩容もチキンヘッドも触らないので、指令は出ない（観測のみ）。
#
# **ブリッジの `/low_state` には載らない**（脚 12 本のみ。2026-09-04 に実機で
# 確認）。観測だけの軸なので実害は無いが、**立ち上げの待ち条件に入れると
# 永久に立てない**。待つのは指令を出す軸だけ、という作りにしてある。
[[aux]]
joint = "FL_wheel_joint"
role = "wheel"
[[aux]]
joint = "FR_wheel_joint"
role = "wheel"
[[aux]]
joint = "RL_wheel_joint"
role = "wheel"
[[aux]]
joint = "RR_wheel_joint"
role = "wheel"

[hardware]
kind = "ros2"
node_name = "misa_run"
namespace = "/keel"
# STM のブリッジが購読／配信しているトピック（ksm_mvp_real_ws）。
command_topic = "/low_command_msg"
state_topic = "/low_state"
state_timeout_ms = 50
# cmd_vel は 10〜20 Hz の publisher もあるので、状態より緩く取る。
cmd_vel_timeout_ms = 300
default_max_speed_rad_s = 8.0
# **目標の変化率の上限。歩容の要求を下回ってはいけない。**
# trot が要求するのは thigh 3.69 / calf 6.68 rad/s（`dump` が毎回出す）。
# 8.0 なら歩容には当たらず、目標が跳んだとき（歩容の切り替え、IK の
# クランプ）は捕まる。モデルの定格（calf 10.47）との厳しいほうが効く。
max_target_rate_rad_s = 8.0

# MIT のゲイン。既定は kp 120 / kd 2.0（hip, thigh, calf とも）。
#
# **この値では立てない。立ち上げ用の柔らかい値。** MuJoCo で同じ制御則
# （τ = kp(q_d − q) − kd·q̇）を回した実測:
#
#   kp   kd    静止時の胴体 z（指令 0.300）  pitch     膝の追従誤差
#   120  2.0   0.250  ← 沈む。腿と車輪が接地   -10.08°   0.330 rad
#   200  2.0   0.297  ← 後輪がまだ触る          -1.55°   0.138
#   300  3.0   0.308  ← 足だけで立つ            -0.63°   0.083
#   600  6.0   0.316                            -0.17°   0.039
#
# 静的にも合う。立ち姿勢で膝に要るトルクは 53 kg ÷ 4 脚 × モーメント腕
# 0.151 m ≒ **19.6 N·m**。kp 120 ならこれを出すのに 19.6/120 = 0.163 rad
# （9.4°）の定常偏差が必要で、4 脚ぶん合わさって 5 cm 沈む。
#
# **立ち上げはこれで正しい**（脚を浮かせて指令角へ寄るのを見る、接地させても
# ゆっくり潰れるだけで暴れない）。歩かせるときは 300 以上へ上げること。
# モータの effort は hip/thigh 96 N·m、calf 180 N·m なので、kp 300 だと
# 0.32 rad の誤差で腿が飽和する。
#
#   [hardware.mit_gains]
#   kp = [120.0, 120.0, 120.0]   # hip, thigh, calf
#   kd = [  2.0,   2.0,   2.0]
