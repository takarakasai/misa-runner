# keel — STM のブリッジへ ROS 2 で繋ぐ構成。
#
# **配線もモータ id も校正値も、ここには書かない。** ゼロ点・可動域・符号は
# STM が持ち、CAN は STM が握る。PC が持つのはモデルと歩容の設定だけ。
#
# **まだ Ros2Plant が無いので run はできない。** いま通るのは check / dump /
# sim（どちらもモデルの [joint.limit] で可動域を検証する）。
name = "keel"

[control]
model = "../mdls/keel/mvp_v12.misa"
rate_hz = 200.0
start_pose = "constrain2"
kinematics_pose = "home"
# 電源投入時の姿勢。校正値を PC が持たないので、モデルの姿勢名で指す。
rest_pose = "constrain2"

# keel のモデルが持つポーズは home / constrain2 / test。namiashi の
# greeting は無いので、演出は名前を空にして無効にしてある。
[poses]
greeting = ""
greeting_alt = ""

# **keel はまだ MuJoCo でまともに歩けていない。** 指令 +0.12 に対して
# 逆向きへ約 -0.12 m/s で進む。この値は「歩けるようになるまでの置き場」で
# あって、調整済みという意味ではない。
#
# 切り分けで**除外できたもの**（いずれも実測）:
#
#   歩容の計画    接地中の足先が -0.120 m/s で後ろへ流れる（指令どおり）
#   IK と符号     計画の足先 → 関節角 → FK が 1e-16 で往復する
#   運動学        足は hip の真下、前後対称（namiashi のほうが非対称）
#   重心          足の支持中央から -0.014 m。ほぼ中央
#   胴体の傾き    -3°。前傾でも後傾でもない
#
# **残っているのは実行側。** MuJoCo での追従誤差が歩幅を超えている:
# 後脚の膝が平均 0.183 rad ずれ、リンク 0.213 m で約 0.039 m。歩幅は
# 0.0204 m しかない。前脚の遊脚率 30% に対し後脚は 14%（trot なら約 50%）で、
# 後脚が地面を引きずっている。ゲインを上げても直らず、kv を上げると発散する。
#
# kp = 60（namiashi の値）だと自重を支えられず崩れる。200 で立つ。
[gait]
# **keel の膝は後ろにしか曲がらない**（calf の可動域が -2.705..-0.838 で
# 常に負）。`<>` は後脚に正の膝角を要求するので可動域を破る。**それでも
# MuJoCo は「それらしく」動き、しかも速く前へ進んで見える** — 脚が可動域に
# 当たって長さが変わっているだけで、歩行ではない。一度これを「調整結果」
# として採ってしまった (2026-09-01)。`sim` にも `dump` と同じ可動域検査を
# 入れてあるので、いまは同じ間違いをすると止まる。
knee_pattern = "both_back"
trot_cycle_s = 0.35
stance_height_m = 0.27
swing_height_m = 0.07
max_vx_m_s = 0.4
max_vy_m_s = 0.2
max_wz_rad_s = 0.8

# 車輪 4 軸。歩容もチキンヘッドも触らないので、指令は出ない（観測のみ）。
[[aux]]
joint = "FL_wheel_joint"
role = "wheel"
[[aux]]
joint = "FR_wheel_joint"
role = "wheel"
[[aux]]
joint = "RL_wheel_joint"
role = "wheel"
[[aux]]
joint = "RR_wheel_joint"
role = "wheel"

[hardware]
kind = "ros2"
node_name = "misa_run"
namespace = "/keel"
# STM のブリッジが購読／配信しているトピック（ksm_mvp_real_ws）。
command_topic = "/low_command_msg"
state_topic = "/low_state"
state_timeout_ms = 50
# cmd_vel は 10〜20 Hz の publisher もあるので、状態より緩く取る。
cmd_vel_timeout_ms = 300
default_max_speed_rad_s = 8.0
max_target_rate_rad_s = 3.0
