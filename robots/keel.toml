# keel — STM のブリッジへ ROS 2 で繋ぐ構成。
#
# **配線もモータ id も校正値も、ここには書かない。** ゼロ点・可動域・符号は
# STM が持ち、CAN は STM が握る。PC が持つのはモデルと歩容の設定だけ。
#
# **まだ Ros2Plant が無いので run はできない。** いま通るのは check / dump /
# sim（どちらもモデルの [joint.limit] で可動域を検証する）。
name = "keel"

[control]
model = "../keel/model/proto2_asset/urdf/mvp_v2.misa"
rate_hz = 200.0
kinematics_pose = "home"
# 屈伸の 2 姿勢をモデルに足した（2026-09-02）。IK で足先を胴体高さ
# 0.14 / 0.38 に置いた解で、hip は 0。
#
#   crouch  屈。足を引き上げて**車輪（胴体 -0.155 m）で座る**
#   extend  伸。脚を伸ばして立つ。車輪は 0.225 m 浮く
#
# 電源投入時は車輪で座っているのが自然なので、待機も初期姿勢も crouch。
# **実機の電源投入姿勢がこれと違うなら、ここを直すこと。** 脱力からの
# 遷移はこの姿勢を始点に張るので、食い違うと実機では起こらない軌道が出る。
start_pose = "crouch"
rest_pose = "crouch"
[poses]
greeting = ""
greeting_alt = ""

# **胴体の当たり判定が 8 個の凸片へ分解され、keel は立って歩くようになった**
# （2026-09-02、モデル側の対応）。それまでは腿の凸包が胴体の凸包に食い込んで
# 85,000 N 超で押し返され、腿が指令の 1/34 しか動かなかった。
#
# 分解後の実測（kp 200 / kv 2.0、歩行 14 秒、trot）:
#
#   静止        前後 +0.123  横 +0.009  回転   +5.8°   pitch -0.01°
#   前進 0.12   前後 +0.972  横 +0.046  回転   -2.3°   pitch -0.33°
#   後退 0.12   前後 -0.685  横 -0.030  回転   -2.2°   pitch +0.27°
#   旋回 +0.5   前後 +0.129  横 +0.006  回転 +188.8°   pitch -0.07°
#   旋回 -0.5   前後 +0.118  横 +0.005  回転 -184.7°   pitch -0.07°
#   横   +0.10  前後 +0.140  横 +0.941  回転   -2.9°   pitch -0.04°
#
# **向きは全方向で正しく、胴体も水平**（pitch は ±0.33° に収まる）。
# 残るのは量で、指令の 41〜58% しか出ない。遊脚率も 27% 前後（trot なら
# 約 50%）なので、足が抜けきらずに引きずっていると見ている。
#
# **注意: 2026-09-02 05:23 に decomposed/*.stl が 0 バイトになった。**
# 上の値は中身があったあいだに採ったもの。いまの状態で回すと STL の
# 読み込みに失敗し、胴体の当たり判定は箱 2 個だけになる（当たらなくなる
# ので、それらしく動いてしまう）。**書き出し直したら採り直すこと。**
#
[gait]
# **`><`（前が前向き・後ろが後ろ向き）。** proto2 では 4 パターンとも
# 可動域には収まるので、決めたのは**胴体との当たり**。腿はまだ 1 枚メッシュ
# ＝MuJoCo では凸包（実体の 1.34 倍）で、`<<` だと前脚の腿がその凸包ごと
# 胴体の下を掃いて左シャーシ側面（base_link_col_4）に 35 mm 食い込む。
# `><` なら前後とも腿が胴体から離れる向きへ振れて、重なりは 0 組になる。
#
#   both_back          <<  重なり 4 組（35mm FL/FR_thigh）  前後 -1.266  pitch +3.03°
#   mammalian_forward  <>  重なり 8 組                      —
#   mammalian_reverse  ><  重なり 0 組                      前後 +0.972  pitch -0.33°
#   both_forward       >>  重なり 4 組（35mm RL/RR_thigh）  —
#
# **腿も分解すれば `<<` も使えるようになる。** 実形状はどちらの向きでも
# 干渉していない（腿の頂点が片 4 の実メッシュに入る数は 0/248）。
knee_pattern = "mammalian_reverse"
trot_cycle_s = 0.35
stance_height_m = 0.30
swing_height_m = 0.07
max_vx_m_s = 0.4
max_vy_m_s = 0.2
max_wz_rad_s = 0.8
# **その場で胴体を傾ける。** 足は接地したまま胴体だけ回る。0 だと無効（既定）。
#
# **上限は「合成量」で、軸ごとではない。** 単軸なら 0.60 まで入るが、
# 3 軸に分けると合わさったぶんが脚の可動域を食う。立ち高さ 0.30 での実測
# （`dump --tilt-roll R --tilt-pitch P --tilt-yaw Y`、違反件数）:
#
#   単軸 0.60           roll OK   pitch OK   yaw OK
#   合成 0.60  pitch=yaw       508 件（FL_calf が -2.705 に当たる）
#   合成 0.60  roll=pitch=yaw  540 件
#   合成 0.55  pitch=yaw       OK
#   合成 0.50  21 方向を掃引   すべて OK  ← ここを採る
#
# 立ち高さを下げると pitch が先に当たる（0.27 では合成 0.60 で 1 件、
# 0.26 では 0.55 で 1 件）。stance を下げるならここも下げること。
body_attitude_max_rad = 0.50
body_attitude_tau_s = 0.15

# 車輪 4 軸。歩容もチキンヘッドも触らないので、指令は出ない（観測のみ）。
[[aux]]
joint = "FL_wheel_joint"
role = "wheel"
[[aux]]
joint = "FR_wheel_joint"
role = "wheel"
[[aux]]
joint = "RL_wheel_joint"
role = "wheel"
[[aux]]
joint = "RR_wheel_joint"
role = "wheel"

[hardware]
kind = "ros2"
node_name = "misa_run"
namespace = "/keel"
# STM のブリッジが購読／配信しているトピック（ksm_mvp_real_ws）。
command_topic = "/low_command_msg"
state_topic = "/low_state"
state_timeout_ms = 50
# cmd_vel は 10〜20 Hz の publisher もあるので、状態より緩く取る。
cmd_vel_timeout_ms = 300
default_max_speed_rad_s = 8.0
max_target_rate_rad_s = 3.0
